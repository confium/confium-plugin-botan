name: build

on:
  push:
    branches: [ main ]
    tags: [ v* ]
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - '**.txt'
      - '!CMakeLists.txt'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/*.yml'
      - '!.github/workflows/build.yml'
  pull_request:
    paths-ignore:
      - '/*.sh'
      - '/.*'
      - '/_*'
      - '**.txt'
      - '**.adoc'
      - '**.md'
      - '**.nix'
      - 'flake.lock'

env:
  BOTAN_VERSION: "3.14.0"

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      # Linux: distro botan-3 packages predate 3.13 (no GCM-SIV), build from source
      - name: build Botan from source (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt -y install cmake make g++
          git clone --depth 1 --branch $BOTAN_VERSION https://github.com/randombit/botan.git /tmp/botan-src
          cd /tmp/botan-src
          ./configure.py --prefix=/usr/local --disable-optimization
          make -j2
          sudo make install
          sudo ldconfig

      - name: install botan (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install botan
          botan version

      - name: install MSys and Windows-specific dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          pacboy: >-
            toolchain:p
            cmake:p
            libbotan:p

      - name: report botan version (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          grep -E "BOTAN_VERSION_(MAJOR|MINOR|PATCH)" /ucrt64/include/botan/version.h || true

      # build plugin
      - name: build and test plugin Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .
          ctest --output-on-failure

      - name: build and test plugin non-Windows
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .
          ctest --output-on-failure
